name: Validate portfolio showcase
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate every case study
        run: node scripts/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-showcase
          path: dist
          include-hidden-files: true
          retention-days: 7
      - name: Trigger Cloudflare production build
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo '::error::CLOUDFLARE_DEPLOY_HOOK is missing; nothing was deployed.'
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 --request POST "$DEPLOY_HOOK" | jq -e '.success == true'
